version: 2

models:
  - name: dim_products
    description: "Справочник товаров"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - positive_values # <--- Наш кастомный тест

  - name: fct_orders
    description: "Факты заказов"
    config:
      contract:
        enforced: true # <--- Включаем контракт (строгие типы)
    columns:
      - name: order_id
        data_type: integer
        tests:
          - unique
          - not_null
      - name: quantity
        data_type: integer
      - name: order_total_amount
        data_type: numeric
