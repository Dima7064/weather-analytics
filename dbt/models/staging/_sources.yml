    schema: raw
    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 48, period: hour }
    loaded_at_field: order_date # Используем дату заказа как индикатор свежести
    tables:
      - name: customers
      - name: products
      - name: orders
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 48, period: hour }
