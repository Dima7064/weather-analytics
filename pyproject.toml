[project]
name = "weather-analytics"
version = "0.1.0"
description = "Weather analytics platform: ingestion, dbt, Airflow, BI"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "clickhouse-connect>=0.7",
    "pandas>=2.1",
    "polars>=0.20",
    "duckdb>=0.9",
    "typer>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion/src/weather_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ingestion/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "ingestion/src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "tests"]
addopts = "-v --cov=weather_ingest --cov-report=term-missing"
pythonpath = ["ingestion/src"]
