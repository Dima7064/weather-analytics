[project]
name = "ecom-analytics"
version = "0.1.0"
description = "E-commerce analytics platform: ingestion, dbt, Airflow, BI"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandas>=2.1",
    "typer>=0.9",
    "rich>=13.0",
    "dbt-postgres>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "types-requests>=2.31",
]

[project.scripts]
ecom-ingest = "ecom_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion/src/ecom_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ingestion/src", "tests"]
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "ingestion/src"
ignore_missing_imports = true
exclude = ["data/"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "tests"]
addopts = "-v --cov=ecom_ingest --cov-report=term-missing"
pythonpath = ["ingestion/src"]
